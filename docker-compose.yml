version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: mongo-pivot-backend
    env_file: [ ./.env ]
    environment:
      - PORT=8000
      - MONGO_URI=${MONGO_URI:-mongodb://host.docker.internal:27017}
      - MONGO_DB=${MONGO_DB:-mongo_pivot_db}
      - ALLOWED_COLLECTIONS=${ALLOWED_COLLECTIONS:-*}
      - PIVOT_PREFS_COLLECTION=${PIVOT_PREFS_COLLECTION:-pivot_prefs}
    ports: 
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: mongo-pivot-frontend
    env_file: [ ./.env ]
    environment: 
      - API_BASE=http://localhost:${BACKEND_PORT:-8000}
    ports: 
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data: